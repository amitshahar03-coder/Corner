<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הפינה שלי</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF4EA; --card:#FFFDF8; --ink:#4A3B32; --muted:#8C7A6B; --line:#EADBC8;
  --terra:#C8745A; --terra-d:#B0603F; --sage:#8FA88A; --sage-l:#E4EDDF; --butter:#F6E3B4; --blush:#F6DAD0;
  --shadow:0 6px 20px rgba(120,80,50,.09);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#2B231E; --card:#362C26; --ink:#F3E8DA; --muted:#BBA894; --line:#4A3D34;
    --terra:#E08E73; --terra-d:#D07C60; --sage:#9DB898; --sage-l:#3C4638; --butter:#5A4A2C; --blush:#5A3D36; --shadow:0 6px 20px rgba(0,0,0,.3); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:'Assistant',system-ui,sans-serif; color:var(--ink); line-height:1.5; font-size:16px;
  background:
    radial-gradient(420px 300px at 100% -40px, var(--blush), transparent 70%),
    radial-gradient(380px 280px at 0% 120px, var(--butter), transparent 70%),
    var(--bg);
  background-repeat:no-repeat; min-height:100vh;
}
#app{max-width:520px;margin:0 auto;padding:20px 16px calc(100px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:'Varela Round','Assistant',sans-serif;font-weight:400;margin:0}
h1{font-size:28px;line-height:1.2}
h2{font-size:21px;margin-bottom:4px}
h3{font-size:17px;margin-bottom:6px}
p{margin:4px 0}
.sub{color:var(--muted);font-size:15px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin:14px 0;border:1px solid var(--line)}
.card.warm{background:linear-gradient(160deg,var(--butter),var(--blush));border:none}
.card.sage{background:var(--sage-l);border:none}
.card.today{border:2px solid var(--terra)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=date],textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);
  border-radius:14px;padding:10px 12px;outline:none;resize:vertical;
}
textarea{min-height:90px}
input:focus,textarea:focus{border-color:var(--terra)}
::placeholder{color:var(--muted);opacity:.7}
.btn{font:inherit;font-weight:600;border:none;border-radius:14px;padding:10px 16px;cursor:pointer;background:var(--terra);color:#fff;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--terra);border:1.5px solid var(--terra)}
.btn.soft{background:var(--sage-l);color:var(--ink)}
.btn.small{padding:6px 12px;font-size:14px;border-radius:12px}
.btn.icon{padding:10px 14px}
.chip{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;margin:0 0 6px 6px}
.chip.on{background:var(--sage-l);border-color:var(--sage)}
.chip:active{transform:scale(.97)}
.x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 6px;line-height:1}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.mood{font:inherit;background:var(--bg);border:2px solid transparent;border-radius:16px;padding:8px 2px;cursor:pointer;text-align:center;font-size:12.5px;color:var(--ink)}
.mood span{display:block;font-size:26px}
.mood.on{border-color:var(--terra);background:var(--card)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--terra));border-radius:99px;transition:width .4s}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:none}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--sage);background:transparent;flex:none;cursor:pointer;color:var(--ink);font:inherit;font-size:14px;line-height:1;padding:0;display:grid;place-items:center}
.check.on{background:var(--sage);color:#fff}
.check.big{width:38px;height:38px;font-size:16px}
.done-t{text-decoration:line-through;color:var(--muted)}
.slot{font-family:'Varela Round',sans-serif;font-size:16px;margin:14px 0 2px;color:var(--terra-d)}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabbar-in{display:flex;max-width:520px;width:100%}
.tab{flex:1;min-width:0;font:inherit;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 0;font-size:10.5px;border-radius:14px}
.tab span{display:block;font-size:20px;filter:grayscale(.6);opacity:.8}
.tab.on{color:var(--terra-d);font-weight:700}
.tab.on span{filter:none;opacity:1}
.hearts button{background:none;border:none;font-size:20px;cursor:pointer;padding:0 1px;opacity:.3}
.hearts button.on{opacity:1}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:1px 9px;background:var(--blush);margin-inline-start:6px;color:var(--ink)}
.tag.t2{background:var(--sage-l)}
.hint{font-size:14px;color:var(--muted);background:var(--bg);border-radius:12px;padding:8px 12px;margin:8px 0}
.jsec{margin:16px 0 4px}
.jin{margin:6px 0}
.breath{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0}
.breath div{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,var(--sage),var(--sage-l));animation:br 10s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.7)}40%{transform:scale(1.35)}}
.big{font-size:44px;text-align:center}
.center{text-align:center}
#toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90%;text-align:center;font-size:15px}
#toast.show{opacity:1;transform:translateX(-50%)}
#letter{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto;
  background:radial-gradient(500px 400px at 80% 0, var(--blush), transparent 70%),radial-gradient(500px 400px at 10% 100%, var(--butter), transparent 70%),var(--bg)}
#letter.show{display:flex;animation:fade .6s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.paper{max-width:420px;background:var(--card);border-radius:8px 24px 24px 24px;padding:26px 24px;box-shadow:0 14px 40px rgba(120,80,50,.18);border:1px solid var(--line);font-family:'Varela Round','Assistant',sans-serif;font-size:18px;line-height:1.75}
.paper .sig{margin-top:14px;text-align:left;color:var(--terra-d)}
details summary{cursor:pointer;color:var(--muted);font-size:15px}
.j-hist{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.j-hist .chip{flex:none;margin:0}
/* sheet */
#sheet{position:fixed;inset:0;z-index:40;display:none;background:rgba(40,28,20,.45);align-items:flex-end;justify-content:center}
#sheet.show{display:flex;animation:fade .25s}
.sheet-in{background:var(--bg);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.mic{width:52px;height:52px;border-radius:50%;font-size:22px;padding:0}
.mic.live{background:#d9534f;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,83,79,.5)}50%{box-shadow:0 0 0 12px rgba(217,83,79,0)}}
/* week */
.dayhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dtag{font-size:13px;border-radius:99px;padding:2px 10px;border:none;cursor:default}
.dtag.work{background:var(--butter);color:var(--ink)}
.dtag.free{background:var(--sage-l);color:var(--ink)}
.addrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.addrow .chip{margin:0;font-size:13px}
/* workout game */
.path{display:flex;align-items:center;gap:0;margin:10px 0 6px;overflow-x:auto;padding:6px 2px}
.node{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--line);color:var(--muted);flex:none;font-weight:700}
.node.done{background:var(--sage);color:#fff}
.node.cur{background:var(--terra);color:#fff;box-shadow:0 0 0 5px rgba(200,116,90,.25)}
.node.lock{opacity:.55}
.ln{width:14px;height:3px;background:var(--line);flex:none}
.gcard.locked{opacity:.92}
.fig{display:flex;align-items:center;justify-content:center;gap:2px;color:var(--ink);margin:6px 0}
.fc{text-align:center}
.ex{padding:12px 0;border-bottom:1px dashed var(--line)}
.ex:last-of-type{border-bottom:none}
.boss{background:linear-gradient(160deg,#F6E3B4,#F0B9A4);color:#3b2b20;border:none}
.boss .sub{color:#6b5546}
@media (prefers-color-scheme:dark){ .boss{background:linear-gradient(160deg,#6a5530,#6e3f32);color:#fbefe0} .boss .sub{color:#e6cfba} }
.moods .mood svg{display:block;margin:0 auto 2px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.bk{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 30px 8px 12px;font-size:15px;line-height:1.3}
.bk small{display:block;font-size:11px;color:var(--muted)}
.bk .x{position:absolute;top:2px;left:4px;font-size:16px}
.card.lav{background:#E9E1F3;border:none;color:#3b2b45}
.card.lav .bk{background:#f6f1fb;border-color:#d6c9e8;color:#3b2b45}
.card.lav .bk small{color:#7a6a8a}
@media (prefers-color-scheme:dark){ .card.lav{background:#3d3350;color:#f0e8fa} .card.lav .bk{background:#4a3f60;border-color:#5a4d73;color:#f0e8fa} .card.lav .bk small{color:#c9bde0} }
.seg{display:flex;gap:6px}
.up{color:var(--sage-d,#4f7a5a);font-size:13px;font-weight:700}
.mweek{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--muted);margin-bottom:2px}
.mcell{font:inherit;background:none;border:none;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:2px 0;border-radius:10px}
.mcell span{font-size:11px;color:var(--muted)}
.mcell.fut{opacity:.35;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:3px}
.bars{display:flex;align-items:flex-end;gap:8px;height:100px;margin-top:4px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-size:11px}
.bcol i{display:block;width:100%;border-radius:6px 6px 2px 2px}
.bcol span{color:var(--muted);font-size:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px;font-family:'Varela Round',sans-serif}
.stats span{font-size:12px;color:var(--muted)}
.split{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--line);margin-top:10px}
.split i{display:block;height:100%}

</style>
</head>
<body>
<div id="app"><div id="view"></div></div>
<nav class="tabbar"><div class="tabbar-in">
  <button class="tab" data-a="tab" data-tab="home"><span>🏡</span>בית</button>
  <button class="tab" data-a="tab" data-tab="week"><span>🗓️</span>שבוע</button>
  <button class="tab" data-a="tab" data-tab="money"><span>💰</span>כסף</button>
  <button class="tab" data-a="tab" data-tab="work"><span>💪</span>אימון</button>
  <button class="tab" data-a="tab" data-tab="hobby"><span>🎨</span>תחביבים</button>
  <button class="tab" data-a="tab" data-tab="goals"><span>🌱</span>מטרות</button>
  <button class="tab" data-a="tab" data-tab="write"><span>📓</span>כתיבה</button>
</div></nav>
<div id="toast"></div>
<div id="letter"><div class="paper" id="paper"></div></div>
<div id="sheet"><div class="sheet-in" id="sheet-in"></div></div>

<script>
/* ====== אפשר לשנות כאן את המכתב ====== */
/* להחזרת המכתב: לשנות ל-true */
const SHOW_LETTER = true;
const LETTER_TITLE = 'לאהבה שלי,';
const LETTER_BODY = [
  'בניתי לך את הפינה הזאת כי אני רואה כמה את מנסה, וכמה היית רוצה קצת יותר סדר ושקט בראש.',
  'זה מקום קוזי שהוא רק שלך. אפשר לבוא אליו בכל מצב רוח, ביום טוב וגם ביום קשה, ולהיות בדיוק כמו שאת. לשבת עם כוס קפה קר, לפתוח את היום או לסגור אותו, לכתוב, לנסות דברים חדשים, או סתם לנוח. אני איתך, בקצב שלך.',
  'אני אוהב אותך. זה בשבילך ❤️'
];
const LETTER_SIGN = 'שלך, באהבה 💜';
/* ==================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const dk = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const pd = s => new Date(s + 'T12:00:00');
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const weekStart = (off=0) => { const x = new Date(); x.setHours(12,0,0,0); x.setDate(x.getDate() - x.getDay() + off*7); return x; };
const wkOf = s => { const x = pd(s); x.setDate(x.getDate()-x.getDay()); return dk(x); };
const fmtD = d => d.getDate() + '.' + (d.getMonth()+1);
const KEY = 'cozy-corner-v1';
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];

const GROUPS = [
  {k:'core',n:'בטן וליבה',e:'🔥'},
  {k:'legs',n:'רגליים',e:'🦵'},
  {k:'glutes',n:'ישבן',e:'🌸'},
  {k:'arms',n:'ידיים וכתפיים',e:'💪'},
  {k:'back',n:'גב וחזה',e:'🦋'}
];
const GN = k => GROUPS.find(g=>g.k===k);
const MAX_GAP = 2;

function defaults(){
  return {
    name:'', seenLetter:false,
    routine:{ items:[], done:{}, sug:{}, tried:[] },
    mood:{}, meTime:{},
    hobbies:[], likes:{good:[],drain:[]},
    goals:[], journal:{},
    weeks:{}, plan:{},
    bank:{ me:[], plan:[], routine:[] }, ed:{},
    chores:[], choreDone:{}, wishes:[],
    money:{ cycleDay:10, earn:{}, skip:{}, ladder:[{min:2500,days:4},{min:4000,days:3}], budget:0, prices:[], spent:{}, alloc:{fun:0,invest:0,liquid:0}, incomeOv:0 },
    workout:{ fit:'', done:{core:0,legs:0,glutes:0,arms:0,back:0}, boss:0, adj:0, hist:[], ext:[], like:{}, dislike:{} }
  };
}
function merge(o){
  const d = defaults(), s = Object.assign(d, o);
  s.workout = Object.assign(defaults().workout, o.workout||{}); s.workout.done = Object.assign(defaults().workout.done, (o.workout||{}).done||{});
  s.money = Object.assign(defaults().money, o.money||{}); s.money.alloc = Object.assign({fun:0,invest:0,liquid:0}, (o.money||{}).alloc||{});
  s.routine = Object.assign(defaults().routine, o.routine||{});
  s.bank = Object.assign(defaults().bank, o.bank||{});
  s.likes = Object.assign({good:[],drain:[]}, o.likes||{});
  ['good','drain'].forEach(k => { s.likes[k] = (s.likes[k]||[]).map(x => typeof x==='string' ? {t:x,d:''} : x); });
  ['ext'].forEach(k => { if(!Array.isArray(s.workout[k])) s.workout[k]=[]; });
  ['like','dislike'].forEach(k => { if(!s.workout[k] || typeof s.workout[k]!=='object') s.workout[k]={}; });
  ['chores','wishes'].forEach(k => { if(!Array.isArray(s[k])) s[k]=[]; });
  if(!s.choreDone || typeof s.choreDone!=='object') s.choreDone = {};
  if(!s.ed || typeof s.ed!=='object') s.ed = {};
  (s.routine.items||[]).forEach(i => edAdd(s,'r_'+i.slot,i.t)); s.routine.items = [];
  (s.bank.routine||[]).forEach(x => edAdd(s,'r_'+x.slot,x.t)); s.bank.routine = [];
  (s.bank.me||[]).forEach(t => edAdd(s,'me',t)); s.bank.me = [];
  (s.bank.plan||[]).forEach(x => edAdd(s, {workout:'wk',hobby:'hs',together:'ht'}[x.kind]||'me', x.t)); s.bank.plan = [];
  return s;
}
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return merge(JSON.parse(r)); }catch(e){}
  return defaults();
}
let S = load();
/* שמירה כפולה: localStorage + IndexedDB, כדי שנתונים לא ייעלמו */
const store = {ls:null, idb:null, at:0};
function lsTest(){ try{ localStorage.setItem('__t','1'); const ok = localStorage.getItem('__t')==='1'; localStorage.removeItem('__t'); return ok; }catch(e){ return false; } }
function idbOpen(){ return new Promise((res,rej)=>{ try{ const r = indexedDB.open('cozy-db',1); r.onupgradeneeded = ()=>r.result.createObjectStore('kv'); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }catch(e){ rej(e); } }); }
async function idbPut(str){ const db = await idbOpen(); return new Promise((res,rej)=>{ const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(str,KEY); tx.oncomplete = ()=>{ db.close(); res(true); }; tx.onerror = ()=>rej(tx.error); }); }
async function idbGet(){ const db = await idbOpen(); return new Promise((res,rej)=>{ const q = db.transaction('kv').objectStore('kv').get(KEY); q.onsuccess = ()=>{ db.close(); res(q.result); }; q.onerror = ()=>rej(q.error); }); }
function statusText(){
  if(store.ls===false && store.idb===false) return '⚠️ הנתונים לא נשמרים בדפדפן הזה';
  const t = store.at ? new Date(store.at).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}) : '';
  return '💾 נשמר בטלפון הזה' + (t ? ' · ' + t : '');
}
function paintStatus(){ const el = document.getElementById('sv'); if(el) el.textContent = statusText(); }
let idbT;
function save(now){
  S._ts = Date.now(); const str = JSON.stringify(S); store.at = S._ts;
  try{ localStorage.setItem(KEY, str); store.ls = true; }catch(e){ store.ls = false; }
  clearTimeout(idbT);
  const go = ()=>{ idbPut(str).then(()=>{ store.idb = true; paintStatus(); }).catch(()=>{ store.idb = false; paintStatus(); }); };
  if(now) go(); else idbT = setTimeout(go, 400);
  paintStatus();
}
window.addEventListener('pagehide', ()=>save(true));
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') save(true); });

let moneyDate = '', moneyHow = '', moneyAmt = '';
let tab = 'home', jdate = dk(), idea = '', surprise = '', wOff = 0, WT = [], W = null, CI = null, tmr = null;

const MOODS = [
  {k:'calm',l:'רגועה',c:'#8fc9a0',s:'איזה כיף. זה זמן טוב ליהנות מהשקט, או לעשות צעד קטן במטרה.'},
  {k:'ok',l:'ככה-ככה',c:'#c3b1e1',s:'ככה-ככה זה לגמרי בסדר. אולי דבר קטן אחד שנעים לך, וזה מספיק להיום.'},

/* figures: stick-figure poses via forward kinematics. angles in degrees, 0=right, 90=up */
const FD = Math.PI/180;
const fpt = (p,a,l) => [p[0] + l*Math.cos(a*FD), p[1] - l*Math.sin(a*FD)];
function figGeom(o){
  const H = o.h, S = fpt(H, o.t, 32), hd = fpt(S, o.n ?? o.t, 15);
  const arm = a => { const e = fpt(S,a[0],16), w = fpt(e,a[1],15); return [S,e,w]; };
  const leg = a => { const k = fpt(H,a[0],21), n = fpt(k,a[1],21), f = fpt(n,a[2],9); return [H,k,n,f]; };
  return {head:hd, torso:[H,S], an:arm(o.an), af:arm(o.af||o.an), ln:leg(o.ln), lf:leg(o.lf||o.ln)};
}
const f1 = v => v.toFixed(1);
function poseSVG(o, w){
  const g = figGeom(o), fl = o.g ?? 104;
  const pl = (pts,op) => `<polyline points="${pts.map(q=>f1(q[0])+','+f1(q[1])).join(' ')}" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`;
  let s = `<path d="M6 ${fl} H134" stroke="currentColor" stroke-width="1.5" opacity=".3"/>`;
  (o.p||[]).forEach(p => {
    if(p[0]==='L') s += `<path d="M${p[1]} ${p[2]} L${p[3]} ${p[4]}" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity=".28"/>`;
    if(p[0]==='R') s += `<rect x="${p[1]}" y="${p[2]}" width="${p[3]}" height="${p[4]}" rx="2" fill="currentColor" opacity=".28"/>`;
  });
  s += pl(g.af,.4) + pl(g.lf,.4) + pl(g.torso,1) + pl(g.ln,1) + pl(g.an,1);
  s += `<circle cx="${f1(g.head[0])}" cy="${f1(g.head[1])}" r="8" fill="var(--card,#fff)" stroke="currentColor" stroke-width="3.5"/>`;
  return `<svg viewBox="0 -12 140 130" width="${w||120}" height="${Math.round((w||120)*130/140)}" role="img" aria-hidden="true">${s}</svg>`;
}

/* ===== לוגיקת משחק האימונים (30 שלבים, בוס כל 5) ===== */
const MAXST = 30;
const isBossSt = s => s % 5 === 0;
const cnt = a => (a||[]).filter(x => (x||'').trim()).length;
const daysSince = s => s ? Math.round((pd(dk()) - pd(s)) / 864e5) : 9999;
function effMult(){
  const base = {beginner:.8, mid:1, fit:1.3}[S.workout.fit] || 1;
  const all = [...S.workout.hist, ...S.workout.ext];
  const weeks = new Set(all.map(h => wkOf(h.d))).size;
  return clamp(base + S.workout.adj + Math.min(.3, .05*Math.max(0, weeks-1)), .5, 1.9);
}
function scaleV(base,type,stage,boost){
  const v = base * effMult() * (1 + .04*(stage-1)) * (boost||1);
  return type==='t' ? clamp(Math.round(v/5)*5, 10, 90) : clamp(Math.round(v), 4, 45);
}
const setsFor = stage => stage<=6 ? 2 : stage<=18 ? 3 : 4;
const mkEx = (e,stage,gk,boost,sets) => ({n:e[0], type:e[1], v:scaleV(e[2],e[1],stage,boost), tip:e[3], sets: sets || setsFor(stage), g:gk, ix:EX[gk].indexOf(e)});
/* חלון של 5 תרגילים: מתקדם לאורך 30 שלבים, מעדיף אהובים, מדלג על לא אהובים */
function pickWindow(gk,stage){
  const pool = EX[gk], n = pool.length, center = (stage-1)*(n-1)/(MAXST-1);
  const lk = S.workout.like, ds = S.workout.dislike;
  return pool.map((e,i) => ({i, s: Math.abs(i-center) - (lk[e[0]]?1.6:0) + (ds[e[0]]?50:0) + ((stage*7+i*3)%5)*.35}))
    .sort((a,b)=>a.s-b.s).slice(0,5).map(x=>x.i).sort((a,b)=>a-b);
}
function buildWorkout(gk,stage){
  if(!isBossSt(stage)) return pickWindow(gk,stage).map(i => mkEx(EX[gk][i], stage, gk));
  const idx = new Set();
  for(let p=stage-4; p<=stage-1; p++) pickWindow(gk,p).forEach(i => idx.add(i));
  const center = (stage-1)*(EX[gk].length-1)/(MAXST-1);
  EX[gk].map((e,i)=>i).filter(i => !idx.has(i) && !S.workout.dislike[EX[gk][i][0]]).sort((a,b)=>Math.abs(a-center)-Math.abs(b-center)).forEach(i => { if(idx.size < 7) idx.add(i); });
  const list = [...idx].sort((a,b)=>a-b).slice(-8).map(i => mkEx(EX[gk][i], stage, gk, 1.15, setsFor(stage)+1));
  return list.slice(0,8);
}
const fmtEx = x => x.type==='t' ? x.v+' שניות' : x.type==='rs' ? x.v+' לכל צד' : x.v+' חזרות';
const lockInfo = gk => { const d = S.workout.done, need = d[gk] - MAX_GAP; return GROUPS.filter(g => g.k!==gk && d[g.k] < need); };
const isLocked = gk => lockInfo(gk).length > 0;
function startGroup(gk){
  if(!S.workout.fit){ toast('קודם נבחר רמת כושר'); tab='work'; return; }
  if(S.workout.done[gk] >= MAXST){ toast('סיימת את כל 30 השלבים כאן 🏆'); tab='work'; return; }
  const li = lockInfo(gk);
  if(li.length){ toast('כדי להמשיך כאן, כדאי קודם: ' + li.map(g=>g.n).join(', ')); tab='work'; return; }
  const stage = S.workout.done[gk] + 1, boss = isBossSt(stage), list = buildWorkout(gk, stage);
  W = {kind:'g', g:gk, stage, boss, title:(boss?'👑 בוס ':GN(gk).e+' אימון ')+GN(gk).n, list, checks:list.map(x=>Array(x.sets).fill(false)), fin:false, res:null};
  tab = 'work';
}
function swapEx(i,dislike){
  const x = W.list[i]; if(!x) return;
  if(dislike){ S.workout.dislike[x.n] = true; delete S.workout.like[x.n]; }
  const used = new Set(W.list.map(y=>y.n));
  const cand = EX[x.g].map((e,ix)=>({e,ix})).filter(o => !used.has(o.e[0]) && !S.workout.dislike[o.e[0]]).sort((a,b)=>Math.abs(a.ix-x.ix)-Math.abs(b.ix-x.ix));
  if(!cand.length){ toast('אין כרגע תרגיל חלופי'); return; }
  const nx = mkEx(cand[0].e, W.stage, x.g, W.boss?1.15:1, x.sets);
  W.list[i] = nx; W.checks[i] = Array(nx.sets).fill(false);
  toast(dislike ? 'לא אציע לך אותו שוב. החלפתי ב: '+nx.n : 'החלפתי ב: '+nx.n);
}
function finishWorkout(q){
  const adjMap = {easy:.1, ok:0, hard:-.1};
  S.workout.adj = clamp(S.workout.adj + adjMap[q], -.4, .6);
  const msgs = [];
  S.workout.done[W.g]++;
  msgs.push(W.boss ? 'ניצחת את הבוס של '+GN(W.g).n+' בשלב '+W.stage+'! 👑' : 'סיימת שלב '+W.stage+' ב'+GN(W.g).n+' 🎉');
  if(S.workout.done[W.g] >= MAXST) msgs.push('🏆 סיימת את כל 30 השלבים ב'+GN(W.g).n+'!');
  else { const li = lockInfo(W.g); msgs.push(li.length ? 'כדי לפתוח את השלב הבא כאן, כדאי לאמן קודם: '+li.map(g=>g.n).join(', ')+'.' : 'השלב הבא כבר פתוח, ואפשר להמשיך מתי שבא לך.'); }
  if(isBossSt(S.workout.done[W.g]+1) && S.workout.done[W.g] < MAXST) msgs.push('👑 השלב הבא ב'+GN(W.g).n+' הוא בוס: משלב את מה שעשית ב-4 השלבים האחרונים.');
  S.workout.hist.push({d:dk(), k:W.g, s:W.stage});
  markWorkoutPlan(W.g);
  W.res = msgs; W.fin = false;
}

}

function choreCands(){
  const out = [];
  S.chores.forEach(c => { const ds = daysSince(c.last); if(!c.last || ds >= c.every) out.push({t:c.t, mine:true, ds}); });
  chBank().forEach(([t,ev]) => { if(S.chores.some(c=>c.t===t)) return; const ds = daysSince(S.choreDone[t]); if(ds >= Math.max(1,Math.round(ev*.8))) out.push({t, mine:false, ds, ev}); });
  return out;
}
function choreSuggest(n){
  const c = choreCands(), mine = c.filter(x=>x.mine), rest = c.filter(x=>!x.mine);
  const shuffle = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
  return [...shuffle(mine), ...shuffle(rest)].slice(0, n||1);
}

const isWork = (ws,date) => { const c = S.weeks[dk(ws)]; return c ? c.work.includes(pd(date).getDay()) : false; };
function suggestWeek(ws){
  const c = S.weeks[dk(ws)]; if(!c) return 0;
  const seq = ['workout','hobby','together','workout','me','chore'];
  let n = 0;
  weekDates(ws).forEach(d => {
    if(pd(d) < addDays(new Date(),-1) || (S.plan[d]||[]).length) return;
    const work = c.work.includes(pd(d).getDay()), sh = shiftOf(c,d);
    if(work && (!sh || sh==='double')) return;
    let kind = seq[n % seq.length]; n++;
    if(work && kind==='workout' && sh==='evening') kind = 'me';
    addPlan(d, kind);
    if(work){ const it = S.plan[d][S.plan[d].length-1]; it.t += ' · '+SHIFTS[sh].w; }
  });
  return n;
}

const hash = s => { let h = 0; for(const c of s) h = (h*31 + c.charCodeAt(0)) >>> 0; return h; };
const routPool = slot => bankEff('r_'+slot);
function routToday(slot){
  const d = dk(), day = (S.routine.sug[d] ||= {});
  if(!day[slot]){
    const pool = routPool(slot);
    const recent = new Set(Object.keys(S.routine.sug).filter(k=>k<d).sort().slice(-6).map(k => S.routine.sug[k][slot] && S.routine.sug[k][slot].t));
    const cand = pool.filter(t => !recent.has(t)), arr = cand.length ? cand : pool;
    day[slot] = {t: arr[hash(d+slot) % arr.length], done:false};
  }
  return day[slot];
}
function triedMark(t, on){
  const d = dk(), r = S.routine.tried.find(x=>x.t===t);
  if(on){ if(r){ r.n++; r.last = d; } else S.routine.tried.push({t, n:1, last:d}); }
  else if(r){ r.n--; if(r.n<=0) S.routine.tried = S.routine.tried.filter(x=>x!==r); }
}

}

function periodInfo(off){
  if(sumP==='week'){

    return {dates: weekDates(ws), label: (off===0?'השבוע':off===-1?'שבוע שעבר':'שבוע של')+' · '+fmtD(ws)+' – '+fmtD(addDays(ws,6))};
  }
  const t = new Date(); t.setHours(12,0,0,0); t.setDate(1); t.setMonth(t.getMonth()+off);
  const last = new Date(t.getFullYear(), t.getMonth()+1, 0, 12), dates = [];
  for(let d = new Date(t); d <= last; d = addDays(d,1)) dates.push(dk(d));
  return {dates, label: t.toLocaleDateString('he-IL',{month:'long',year:'numeric'}), first:t};
}
function pStats(dates){

  dates.forEach(d => {

    r.me += (S.meTime[d]||[]).length;

    const er = S.money.earn[d]; if(er){ r.shifts++; r.earn += +er.amt||0; }
  });
  r.sport = [...sportDates()].filter(d=>set.has(d)).length;
  return r;
}

function cyc(ref){
  const r = ref ? new Date(ref) : new Date(); r.setHours(12,0,0,0);
  const cd = S.money.cycleDay;
  let s = new Date(r.getFullYear(), r.getMonth(), cd, 12);
  if(s > r) s = new Date(r.getFullYear(), r.getMonth()-1, cd, 12);
  return {s, e:new Date(s.getFullYear(), s.getMonth()+1, cd-1, 12), pay:new Date(s.getFullYear(), s.getMonth()+1, cd, 12)};
}
function cycData(){
  const c = cyc(), sk = dk(c.s), ek = dk(c.e), today = dk(), T = pd(today);
  const ents = Object.entries(S.money.earn).filter(([d]) => d>=sk && d<=ek).sort();
  const total = ents.reduce((a,[,v]) => a + (+v.amt||0), 0), n = ents.length, avg = n ? total/n : 0;
  const daysLeft = Math.max(0, Math.round((c.e - T)/864e5)), len = Math.round((c.e - c.s)/864e5) + 1;
  let planned = 0, unknown = 0;
  for(let i=1;i<=daysLeft;i++){ const d = addDays(T,i), cf = S.weeks[wkOf(dk(d))]; if(!cf) unknown++; else if(cf.work.includes(d.getDay())) planned++; }
  const missing = [];
  for(let d = new Date(c.s); dk(d) < today; d = addDays(d,1)){
    const k = dk(d), cf = S.weeks[wkOf(k)];
    if(cf && cf.work.includes(d.getDay()) && !S.money.earn[k] && !S.money.skip[k]) missing.push(k);
  }
  const spent = Object.entries(S.money.spent).filter(([d]) => d>=sk && d<=ek).reduce((a,[,l]) => a + l.reduce((x,y)=>x+(+y.amt||0),0), 0);
  return {c, sk, ek, ents, total, n, avg, daysLeft, len, planned, unknown, missing, spent, payIn: Math.round((c.pay - T)/864e5)};
}
function moneyStats(){
  const ents = Object.entries(S.money.earn); if(!ents.length) return null;
  const total = ents.reduce((a,[,v]) => a + (+v.amt||0), 0), n = ents.length;
  const weeks = new Set(ents.map(([d])=>wkOf(d))).size;
  const months = {}; ents.forEach(([d,v]) => { const k = dk(cyc(pd(d)).s); months[k] = (months[k]||0) + (+v.amt||0); });
  const mk = Object.keys(months), ds = ents.map(([d])=>d).sort();
  const span = Math.max(1, Math.round((pd(ds[ds.length-1]) - pd(ds[0]))/864e5) + 1);
  return {n, perShift: total/n, perWeek: total/weeks, perMonth: mk.reduce((a,k)=>a+months[k],0)/mk.length, perDay: total/span, weeks, months: mk.length};
}
function todayWorkNoEntry(){

  'be-del':(d)=>{ const b=edGet(BE.key); if(d.t==='a') b.add.splice(+d.i,1); else { if(!b.hide.includes(d.o)) b.hide.push(d.o); delete b.ren[d.o]; } save(); renderSheet(); return 0; },
  'be-restore':(d)=>{ const b=edGet(BE.key); b.hide=b.hide.filter(x=>x!==d.o); save(); renderSheet(); return 0; },
  /* דקה איתי */
  'ci-open':()=>{ CI = {mode:'day', text:'', saved:false}; renderSheet(); return 0; },
  'ci-close':()=>{ stopDict(); CI=null; $('#sheet').classList.remove('show'); },
  'ci-mic':async()=>{
    try{ if(dictOn){ await dict.stop(); } else { dict.start().catch(e=>{ if(e && e.code==='not_granted') toast('אפשר להקליד, או להכתיב מהמקלדת של הטלפון'); }); } }catch(e){ toast('אפשר להקליד, או להכתיב מהמקלדת של הטלפון'); }
    return 0;
  },
  'ci-save':()=>{
    const t = ciText().trim(); if(!t){ toast('אפשר לכתוב גם משפט אחד'); return 0; }
    stopDict(); const e = dayEntry(dk());
    const stamp = new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}) + ': ' + t;
    e.free = (e.free ? e.free + '\n\n' : '') + stamp;
    CI.saved = true; save(true); renderSheet(); return 0;
  },
  'ci-openj':()=>{ stopDict(); CI=null; $('#sheet').classList.remove('show'); jdate=dk(); wmode='write'; tab='write'; render(); window.scrollTo(0,0);
    const f = document.getElementById('free'); if(f){ f.scrollIntoView({block:'center'}); } return 0; }
};
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-a]'); if(!b || b.disabled) return;
  const f = A[b.dataset.a]; if(!f) return;
  const r = await f(b.dataset);
  if(r === 0) return;
  save(); render();
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.id==='e-date' && t.value){ moneyDate = t.value; render(); return; }
  if(t.dataset && t.dataset.be && BE){
    const v = t.value.trim(), b = edGet(BE.key);
    if(!v){ renderSheet(); return; }
    if(t.dataset.be==='a') b.add[+t.dataset.i] = v;
    else { if(v===t.dataset.o) delete b.ren[t.dataset.o]; else b.ren[t.dataset.o] = v; }
    save();
  }
});
document.addEventListener('keydown', ev => {
  if(ev.key==='Enter' && ev.target.dataset && ev.target.dataset.be){ ev.target.blur(); return; }
  if(ev.key!=='Enter' || ev.target.tagName!=='INPUT' || ev.target.type!=='text' || ev.target.dataset.j || ev.target.dataset.nokey) return;
  const btn = ev.target.parentElement.querySelector('[data-a]'); if(btn) btn.click();
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if(t.id==='cit'){ if(CI) CI.text = t.value; return; }
  if(t.id==='e-amt'){ moneyAmt = t.value; return; }
  if(t.id==='e-note'){ moneyNote = t.value; return; }
  const j = t.dataset && t.dataset.j; if(!j) return;
  const e = dayEntry(jdate);
  if(j==='free') e.free = t.value;
  else {
    const [k,i] = j.split('.'), ix = +i;
    while(e[k].length < ix) e[k].push('');
    e[k][ix] = t.value;
    const wrap = t.closest('.jin');
    if(wrap && !wrap.nextElementSibling && t.value.trim() && ix < 14){
      const nw = wrap.cloneNode(true), ni = nw.querySelector('input'); ni.value = ''; ni.dataset.j = k+'.'+(ix+1); wrap.after(nw);
    }
  }
  save();
});

store.ls = lsTest();
render();
if(SHOW_LETTER && !S.seenLetter) showLetter();
(async()=>{
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{
    const r = await idbGet();
    if(r){ const o = JSON.parse(r); store.idb = true; if((o._ts||0) > (S._ts||0)){ S = merge(o); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} render(); } }
    else { store.idb = true; if(S._ts) idbPut(JSON.stringify(S)).catch(()=>{}); }
  }catch(e){ store.idb = false; }
  paintStatus();
  if(store.ls===false && store.idb===false) render();
})();
</script>
</body>
</html>
